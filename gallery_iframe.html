<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Cosmic Gallery</title>
    <style>
        body {
            text-align: center;
            background: #111;
            color: #fff;
        }

        .gallery-img {
            max-width: 90%;
            max-height: 400px;
            border: 4px solid #444;
            border-radius: 10px;
            margin: 20px 0;
        }

        .gallery-controls {
            margin: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 1.2em;
            margin: 0 10px;
            border-radius: 5px;
            border: none;
            background: #333;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }
    </style>
</head>

<body>
    <h2>Cosmic Gallery</h2>
    <div id="gallery-container">
        <img id="gallery-img" class="gallery-img" src="imgs_cosmic_gallery/hubble-ngc2005-potw2424a.jpg"
            alt="Cosmic Image" />
    </div>
    <div class="gallery-controls">
        <button onclick="prevImage()">Previous</button>
        <button onclick="nextImage()">Next</button>
    </div>
    <script src="javascript_cosmic_gallery.js"></script>
    <script>
        let current = 0;
        const imgEl = document.getElementById('gallery-img');
        function showImage(idx) {
            current = (idx + galleryImages.length) % galleryImages.length;
            imgEl.src = galleryImages[current];
        }
        function prevImage() { showImage(current - 1); }
        function nextImage() { showImage(current + 1); }
        // Initialize with the first image
        imgEl.src = galleryImages[0];
    </script>
</body>

</html>
